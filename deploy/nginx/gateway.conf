map $http_x_forwarded_proto $original_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    set $frontend http://frontend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $original_scheme;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Health details and Swagger remain private to the Docker network.
    location /actuator { return 404; }
    location /swagger-ui { return 404; }
    location /v3/api-docs { return 404; }

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_cache off;
    }

    location / {
        proxy_pass $frontend$request_uri;
        proxy_http_version 1.1;
    }
}
